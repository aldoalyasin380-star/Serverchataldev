<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>Aldev Chat</title>
<style>
:root {
  --bg: #0b0e14;
  --panel: #131722;
  --panel-hover: #1c2130;
  --line: #212635;
  --tx: #e6e8ec;
  --mu: #7a8294;
  --ac: #3ddc97;
  --mine: #164030;
  --other: #181d2a;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { 
  height: 100%; 
  background: #05070a; 
  color: var(--tx); 
  font: 14px/1.4 system-ui, -apple-system, sans-serif;
  display: flex;
  justify-content: center;
}

/* WAPPER UTAMA: Mengunci Lebar Selebar Layar HP (Max 480px) */
.app-container {
  width: 100%;
  max-width: 480px;
  height: 100dvh;
  background: var(--bg);
  position: relative;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 0 30px #000a;
}

button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
.hidden { display: none !important; }

/* Avatar Base */
.av { width: 42px; height: 42px; border-radius: 12px; object-fit: cover; flex: none; display: grid; place-items: center; font-weight: 700; color: #fff; }
.av.s { width: 36px; height: 36px; border-radius: 10px; font-size: 13px; }
.av.lg { width: 80px; height: 80px; border-radius: 20px; font-size: 28px; margin: 0 auto 10px; }

/* Verified Badge */
.bl { width: 14px; height: 14px; vertical-align: -2px; margin-left: 4px; }
.bl.red circle { fill: #ff4757 !important; }
.bl.orange circle { fill: #ffa502 !important; }
.bl.yellow circle { fill: #eccc68 !important; }
.bl.blue circle { fill: #2f81f7 !important; }
@keyframes rainbowGlow {
  0% { fill: #ff0055; filter: drop-shadow(0 0 2px #ff0055); }
  20% { fill: #ff9900; filter: drop-shadow(0 0 2px #ff9900); }
  40% { fill: #33cc33; filter: drop-shadow(0 0 2px #33cc33); }
  60% { fill: #00ccff; filter: drop-shadow(0 0 2px #00ccff); }
  80% { fill: #9933ff; filter: drop-shadow(0 0 2px #9933ff); }
  100% { fill: #ff0055; filter: drop-shadow(0 0 2px #ff0055); }
}
.bl.rainbow circle { animation: rainbowGlow 2.5s infinite linear; }

/* Custom Form Elements */
input, textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; outline: none; }
input:focus, textarea:focus { border-color: var(--ac); }
.btn { background: var(--ac); color: #06281b; font-weight: 700; padding: 10px 16px; border-radius: 10px; }
.btn.g { background: var(--panel); color: var(--tx); border: 1px solid var(--line); }
.btn.danger { background: #ff5252; color: #fff; }
.btn:disabled { opacity: .4; }

/* Header & Profile Bar */
.mebar { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
.mebar .nm { flex: 1; min-width: 0; }
.nm b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 15px; }
.nm span { color: var(--mu); font-size: 12px; }
.ico { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-size: 18px; color: var(--mu); }
.ico:active { background: var(--line); }

/* WA Channel Link */
.wa-channel-btn {
  display: flex; align-items: center; gap: 8px; padding: 9px 12px; margin: 10px 12px 4px;
  background: #25d36615; border: 1px solid #25d36640; border-radius: 10px;
  color: #25d366; font-weight: 600; font-size: 12.5px; text-decoration: none;
}
.wa-channel-btn:active { background: #25d36630; }

.sbox { padding: 8px 12px; }
#list { overflow-y: auto; flex: 1; padding-bottom: 80px; }
.sec { padding: 8px 14px 4px; font-size: 11px; color: var(--mu); text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }

/* Item List Chat */
.item { display: flex; gap: 12px; padding: 10px 14px; align-items: center; cursor: pointer; border-bottom: 1px solid #ffffff05; }
.item:active, .item.on { background: var(--panel); }
.item .m { flex: 1; min-width: 0; }
.item .t { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 2px; }
.item .t b { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .t small { color: var(--mu); font-size: 11px; flex: none; }
.item .p { color: var(--mu); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; justify-content: space-between; }
.un { background: var(--ac); color: #06281b; font-size: 11px; font-weight: 800; border-radius: 8px; padding: 1px 6px; margin-left: 6px; }

/* Floating Add Button */
.fab {
  position: absolute; right: 16px; bottom: 20px; width: 48px; height: 48px;
  border-radius: 14px; background: var(--ac); color: #06281b; font-size: 24px;
  box-shadow: 0 6px 16px #000a; z-index: 10; display: grid; place-items: center; font-weight: bold;
}

/* Chat Screen */
#chat { position: absolute; inset: 0; background: var(--bg); z-index: 20; display: flex; flex-direction: column; }
.ch { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
.ch .nm { flex: 1; min-width: 0; cursor: pointer; }

#msgs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; flex-direction: column; align-items: flex-start; max-width: 100%; }
.row.me { align-items: flex-end; }
.b { max-width: 82%; background: var(--other); border: 1px solid var(--line); border-radius: 12px 12px 12px 2px; padding: 8px 11px; word-wrap: break-word; overflow-wrap: anywhere; position: relative; }
.row.me .b { background: var(--mine); border-color: #21543f; border-radius: 12px 12px 2px 12px; }
.who { font-size: 11.5px; font-weight: 700; color: var(--ac); margin-bottom: 2px; }
.meta { font-size: 10px; color: var(--mu); text-align: right; margin-top: 2px; display: flex; align-items: center; justify-content: flex-end; gap: 3px; }
.rb, .del-btn { font-size: 11px; opacity: .7; padding: 0 2px; background: none; border: none; cursor: pointer; }

.b code { background: #0005; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 12px; }
.sp { background: #555; color: transparent; border-radius: 4px; cursor: pointer; }
.sp.on { background: none; color: inherit; }
.rx { display: flex; gap: 4px; margin-top: 2px; }
.rx span { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; font-size: 11px; padding: 0 6px; }

.comp { display: flex; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--line); background: var(--panel); align-items: center; }
.comp input { border-radius: 18px; padding: 9px 14px; font-size: 13.5px; }
.comp .btn { border-radius: 18px; padding: 0 14px; height: 38px; font-size: 13px; }

.chat-search-bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }

/* Modal & Action Sheet */
.modal { position: absolute; inset: 0; background: #000b; display: grid; place-items: center; padding: 16px; z-index: 50; overflow: auto; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; width: 100%; max-width: 380px; padding: 16px; }
.box h3 { margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 16px; }
.box label { display: block; font-size: 11px; color: var(--mu); margin: 10px 0 4px; text-transform: uppercase; font-weight: 700; }
.acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }

.action-sheet { position: absolute; bottom: 0; left: 0; right: 0; background: var(--panel); border-radius: 16px 16px 0 0; padding: 12px; z-index: 45; border-top: 1px solid var(--line); }
.action-item { display: flex; align-items: center; gap: 10px; padding: 12px; width: 100%; font-size: 14px; color: var(--tx); border-radius: 8px; text-align: left; }
.action-item:active { background: var(--bg); }

.member-list-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #ffffff08; }
.member-list-item .m-info { flex: 1; min-width: 0; }
.member-list-item .m-info b { display: block; font-size: 13px; }
.member-list-item .m-info span { font-size: 11px; color: var(--mu); }
.member-list-item .m-role { font-size: 10px; background: #ffffff10; padding: 2px 5px; border-radius: 4px; color: var(--ac); margin-left: auto; }

.code { font-family: monospace; color: #6cb6ff; background: var(--bg); padding: 8px 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
#toast { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: #222833; border: 1px solid var(--line); padding: 8px 14px; border-radius: 10px; z-index: 60; font-size: 12px; opacity: 0; pointer-events: none; transition: .2s; }
#toast.on { opacity: 1; }

.auth { min-height: 100%; display: grid; place-items: center; padding: 20px; width: 100%; }
.card { width: 100%; max-width: 320px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
.card h1 { font-size: 20px; margin-bottom: 2px; }
.card p { color: var(--mu); font-size: 12px; margin-bottom: 14px; }
</style>
</head>
<body>

<div class="app-container">
  <!-- AUTH SCREEN -->
  <div id="auth" class="auth hidden">
    <div class="card">
      <h1>Aldev Chat</h1>
      <p>Masukkan username kamu untuk masuk.</p>
      <label>Username</label>
      <input id="rUser" maxlength="20" placeholder="contoh: aldev" autocapitalize="none" autocomplete="off">
      <label style="margin-top:8px;">Nama (Khusus Pengguna Baru)</label>
      <input id="rName" maxlength="30" placeholder="Nama kamu">
      <div class="err" id="aErr" style="color:#ff5252;font-size:12px;margin-top:6px;"></div>
      <button class="btn" style="width:100%; margin-top:12px;" id="aGo">Masuk</button>
    </div>
  </div>

  <!-- MAIN APP SCREEN -->
  <div id="app" class="app hidden" style="height:100%; display:flex; flex-direction:column; position:relative;">
    <aside class="side" style="display:flex; flex-direction:column; height:100%; position:relative;">
      <div class="mebar">
        <div id="meAv"></div>
        <div class="nm"><b id="meName"></b><span id="meUser"></span></div>
        <button class="ico" id="gear" title="Pengaturan">⚙</button>
      </div>
      
      <a href="https://whatsapp.com/channel/0029VbDanaD4yltW4XVITR1q" target="_blank" class="wa-channel-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0 0 12.04 2zm5.82 14.12c-.24.68-1.22 1.24-1.7 1.3-.44.06-1.01.09-3.23-.82-2.83-1.17-4.66-4.04-4.8-4.23-.14-.19-1.15-1.53-1.15-2.92 0-1.39.73-2.07.99-2.35.26-.28.57-.35.76-.35.19 0 .38 0 .54.01.18.01.42-.07.65.49.24.57.82 2 .89 2.15.07.15.12.33.02.52-.1.19-.15.31-.29.48-.14.17-.3.38-.43.51-.14.14-.29.3-.13.58.16.28.72 1.19 1.55 1.93 1.07.95 1.97 1.25 2.25 1.39.28.14.44.12.6-.07.16-.19.68-.79.86-1.06.18-.27.36-.23.6-.14.24.09 1.53.72 1.79.85.26.13.43.19.49.3.06.11.06.63-.18 1.31z"/>
        </svg>
        Channel Developer
      </a>

      <div class="sbox"><input id="q" placeholder="Cari chat atau orang..." autocomplete="off"></div>
      <div id="list"></div>
      <button class="fab" id="fab">+</button>
    </aside>

    <!-- CHAT WINDOW (OVERLAY) -->
    <section id="chat" class="hidden">
      <div class="ch">
        <button class="ico" id="back">←</button>
        <div id="cAv" onclick="showGroupInfo()"></div>
        <div class="nm" onclick="showGroupInfo()">
          <b id="cName"></b>
          <span id="cSub" style="color:var(--mu);font-size:11.5px"></span>
        </div>
        <button class="ico" id="cMenuBtn">⋮</button>
      </div>

      <div id="chatSearchBar" class="chat-search-bar hidden">
        <input id="inChatSearchInput" placeholder="Cari pesan..." autocomplete="off">
        <button class="btn g" onclick="closeInChatSearch()" style="padding:4px 10px;height:auto;font-size:12px;">Tutup</button>
      </div>

      <div id="msgs"></div>
      
      <div class="comp">
        <input id="inp" placeholder="Tulis pesan..." maxlength="2000" autocomplete="off">
        <button class="btn g" id="vnBtn" title="Rekam VN">🎙️</button>
        <button class="btn danger hidden" id="cancelVnBtn" title="Batal VN">🛑</button>
        <button class="btn" id="send">Kirim</button>
      </div>
    </section>
  </div>

  <div id="actionSheetModal" class="modal hidden" onclick="closeActionSheet(event)">
    <div class="action-sheet" id="actionSheetBox"></div>
  </div>

  <div id="modal" class="modal hidden"><div class="box" id="box"></div></div>
  <div id="toast"></div>
</div>

<script>
const $ = s => document.querySelector(s);
let myUsername = localStorage.getItem('myUsername') || null;
let me = null, chats = [], active = null, msgs = [], start = 0, ver = '', prof = {}, prevCount = null, timer, people = [];
let pinnedChats = JSON.parse(localStorage.getItem('pinnedChats') || '[]');
let archivedChats = JSON.parse(localStorage.getItem('archivedChats') || '[]');
let mutedChats = JSON.parse(localStorage.getItem('mutedChats') || '[]');

let seen = JSON.parse(localStorage.getItem('seen') || '{}');
const saveSeen = () => localStorage.setItem('seen', JSON.stringify(seen));

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = s => esc(s)
  .replace(/`([^`\n]+)`/g, '<code>$1</code>')
  .replace(/(^|\s)\*([^*\n]+)\*(?=\s|$|[.,!?])/g, '$1<b>$2</b>')
  .replace(/(^|\s)_([^_\n]+)_(?=\s|$|[.,!?])/g, '$1<i>$2</i>')
  .replace(/(^|\s)~([^~\n]+)~(?=\s|$|[.,!?])/g, '$1<s>$2</s>')
  .replace(/\|\|([^|\n]+)\|\|/g, '<span class="sp" onclick="this.classList.toggle(\'on\')">$1</span>')
  .replace(/\n/g, '<br>');

const getBadgeSvg = (color = 'blue') => `<svg class="bl ${color}" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#2f81f7"/><path d="M7 12.5l3.2 3.2L17 9" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

const nameOf = u => (prof[u] && prof[u].name) || u;
const badge = u => {
  if (!prof[u] || !prof[u].v) return '';
  return getBadgeSvg(prof[u].badgeColor || 'blue');
};

const hue = s => ([...s].reduce((a, c) => a + c.charCodeAt(0), 0) * 37) % 360;
const avText = (text, seed, cls = '') => `<div class="av ${cls}" style="background:hsl(${hue(seed)} 35% 38%)">${esc((text || '?')[0]).toUpperCase()}</div>`;
const avUser = (u, cls = '') => {
  if (prof[u] && prof[u].a) {
    const src = typeof prof[u].a === 'string' && prof[u].a.startsWith('http') ? prof[u].a : `/api/avatar/${u}?t=${prof[u].a}`;
    return `<img class="av ${cls}" src="${src}">`;
  }
  return avText(nameOf(u), u, cls);
};

const time = ts => new Date(ts).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2600); }

async function api(path, body) {
  const o = { headers: { 'x-user': myUsername || '', 'content-type': 'application/json' } };
  if (body) { o.method = 'POST'; o.body = JSON.stringify(body); }
  const r = await fetch('/api/' + path, o);
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && myUsername) logout();
  if (!r.ok) throw new Error(j.error || 'Gagal');
  return j;
}

async function ensureProfiles(list, force) {
  const u = [...new Set(list.filter(Boolean))].filter(x => force || !(x in prof));
  if (!u.length) return;
  const r = await api('profiles', { users: u });
  u.forEach(x => (prof[x] = r[x] || { name: x }));
}

$('#aGo').onclick = async () => {
  $('#aErr').textContent = '';
  try {
    const name = $('#rName').value;
    const username = $('#rUser').value;
    if (!username) return $('#aErr').textContent = 'Masukkan username kamu';

    const r = await api('register', { name, username });
    myUsername = r.username;
    localStorage.setItem('myUsername', myUsername);
    boot();
  } catch (e) { $('#aErr').textContent = e.message; }
};

function logout() { localStorage.removeItem('myUsername'); localStorage.removeItem('seen'); location.reload(); }

async function boot() {
  $('#auth').classList.add('hidden'); 
  $('#app').classList.remove('hidden');
  try {
    me = await api('me');
    prof[me.username] = { name: me.name, v: me.verified || me.username === 'aldev', badgeColor: me.devBadgeColor || 'blue', a: me.av };
    drawMe();
    await loadChats();
    tick();
  } catch(e) { logout(); }
}

function drawMe() {
  const color = me.devBadgeColor || 'blue';
  const badgeSvg = (me.verified || me.username === 'aldev') ? getBadgeSvg(color) : '';
  $('#meAv').innerHTML = avUser(me.username);
  $('#meName').innerHTML = esc(me.name) + badgeSvg;
  $('#meUser').textContent = '@' + me.username;
}

async function tick() {
  try {
    const j = await api('sync');
    if (j.v !== ver) { ver = j.v; await loadChats(); if (active) await loadMessages(); }
  } catch (e) {}
  clearTimeout(timer);
  timer = setTimeout(tick, document.hidden ? 15000 : 4000);
}

const unread = c => (c.id === active && !document.hidden) ? 0 : Math.max(0, c.count - (seen[c.id] ?? 0));

async function loadChats() {
  const list = await api('chats');
  await ensureProfiles([...list.filter(c => c.type === 'dm').map(c => c.other), ...list.map(c => c.last && c.last.u)], true);
  chats = list;
  renderList();
}

function renderList() {
  const q = $('#q').value.trim().toLowerCase();
  const title = c => c.type === 'dm' ? nameOf(c.other) : c.title;
  
  const show = chats.filter(c => !archivedChats.includes(c.id) && (!q || title(c).toLowerCase().includes(q))).sort((a, b) => ((b.last && b.last.ts) || 0) - ((a.last && a.last.ts) || 0));

  let html = show.map(c => {
    const u = unread(c);
    const msgText = c.last ? (c.last.t || '🎙️ Pesan suara') : '';
    const prev = c.last ? (c.type === 'dm' ? '' : (c.last.u === myUsername ? 'Kamu' : nameOf(c.last.u)) + ': ') + msgText : 'Belum ada pesan';
    let aHtml = c.type === 'dm' ? avUser(c.other) : (c.avatar ? `<img class="av" src="${c.avatar}">` : avText(title(c), c.id));

    return `<div class="item ${c.id === active ? 'on' : ''}" onclick="openChat('${c.id}')">${aHtml}<div class="m">
      <div class="t"><b>${esc(title(c))}${c.type === 'dm' ? badge(c.other) : ''}</b><small>${c.last ? time(c.last.ts) : ''}</small></div>
      <div class="p"><span>${esc(prev)}</span>${u ? `<span class="un">${u}</span>` : ''}</div></div></div>`;
  }).join('');

  if (!show.length && !people.length) html = '<div style="padding:20px;text-align:center;color:var(--mu)">Belum ada chat</div>';
  $('#list').innerHTML = html;
}

async function openChat(id) {
  active = id; msgs = [];
  const c = chats.find(x => x.id === id);
  if (c) seen[id] = c.count; saveSeen();
  $('#chat').classList.remove('hidden');
  const t = c ? (c.type === 'dm' ? nameOf(c.other) : c.title) : '';
  
  $('#cName').innerHTML = esc(t) + (c && c.type === 'dm' ? badge(c.other) : '');
  $('#cAv').innerHTML = c ? (c.type === 'dm' ? avUser(c.other, 's') : (c.avatar ? `<img class="av s" src="${c.avatar}">` : avText(t, c.id, 's'))) : '';

  updateHeaderSub();
  $('#msgs').innerHTML = '';
  renderList();
  await loadMessages();
}

async function updateHeaderSub() {
  if (!active) return;
  const c = chats.find(x => x.id === active);
  if (c && c.type === 'dm') return $('#cSub').textContent = '@' + c.other;

  try {
    const res = await api('group-members?chat=' + encodeURIComponent(active));
    $('#cSub').textContent = `${res.onlineCount} online · ${res.total} member`;
  } catch(e) { $('#cSub').textContent = `Grup`; }
}

$('#back').onclick = () => { active = null; $('#chat').classList.add('hidden'); renderList(); };

async function loadMessages() {
  if (!active) return;
  const j = await api('messages?chat=' + encodeURIComponent(active));
  await ensureProfiles(j.msgs.map(m => m.u));
  msgs = j.msgs; start = j.start;
  renderMsgs();
}

function renderMsgs() {
  const box = $('#msgs');
  const c = chats.find(x => x.id === active);
  const grp = c && c.type !== 'dm';

  box.innerHTML = msgs.map((m, i) => {
    const mine = m.u === myUsername, idx = start + i;
    let content = m.deleted ? `<i>${m.t}</i>` : (m.audio ? `<audio controls src="${m.audio}" style="max-width:200px;height:32px"></audio>` : fmt(m.t));
    const canDelete = mine || myUsername === 'aldev';

    return `<div class="row ${mine ? 'me' : ''}"><div class="b">
      ${grp && !mine ? `<div class="who">${esc(nameOf(m.u))}${badge(m.u)}</div>` : ''}
      <div>${content}</div>
      <div class="meta">${time(m.ts)} ${!m.deleted && canDelete ? `<button class="del-btn" onclick="deleteMessage(${idx})">🗑️</button>` : ''}</div>
    </div></div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}

async function deleteMessage(idx) {
  if(!confirm('Hapus pesan ini?')) return;
  try { await api('delete-message', { chat: active, idx }); await loadMessages(); } catch(e) { toast(e.message); }
}

async function send() {
  const t = $('#inp').value.trim(); if (!t || !active) return;
  $('#inp').value = '';
  try { await api('send', { chat: active, text: t }); await loadMessages(); loadChats(); } catch (e) { toast(e.message); }
}
$('#send').onclick = send;
$('#inp').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); send(); } };

// VN Logic
let mediaRec, audioChunks = [], isRecording = false;
$('#vnBtn').onclick = async () => {
  if (!active) return;
  if (!isRecording) {
    audioChunks = [];
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRec = new MediaRecorder(stream);
      mediaRec.ondataavailable = e => audioChunks.push(e.data);
      mediaRec.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        const blob = new Blob(audioChunks, { type: 'audio/webm' });
        const reader = new FileReader();
        reader.readAsDataURL(blob);
        reader.onloadend = async () => {
          await api('send', { chat: active, text: '', audio: reader.result });
          await loadMessages(); loadChats();
        };
      };
      mediaRec.start();
      isRecording = true;
      $('#vnBtn').textContent = '⏹️';
    } catch(e) { toast('Mic gagal'); }
  } else {
    if (mediaRec) mediaRec.stop();
    isRecording = false;
    $('#vnBtn').textContent = '🎙️';
  }
};

  } catch(e) { toast(e.message); }

if (myUsername) boot(); else $('#auth').classList.remove('hidden');
