<!-- Tambahan elemen di dalam <body> index.html -->
<div class="app-container">
  <!-- Sidebar / Panel Chat -->
  <div class="chat-header">
    <span id="group-title">Channel / Grup Utama Aldev</span>
    <span id="group-verified-badge" class="badge-blue" style="display:inline-block;">✔</span>
    <button onclick="openSettings()">⚙️ Pengaturan</button>
  </div>

  <!-- Area Pesan -->
  <div id="chat-messages" class="chat-messages-box"></div>

  <!-- Panel Input Chat & VN -->
  <div class="chat-input-area">
    <input type="text" id="message-input" placeholder="Ketik pesan..." />
    <button onclick="sendTextMessage()">Kirim</button>
    <button id="mic-btn" onmousedown="startRecording()" onmouseup="stopRecording()">🎙️ VN</button>
  </div>
</div>

<!-- Modal Pengaturan & Auto-Delete Timer -->
<div id="settings-modal" class="modal" style="display:none;">
  <div class="modal-content">
    <h3>Pengaturan Chat & Grup</h3>
    <label>
      <input type="checkbox" id="toggle-autodelete" onchange="toggleAutoDeleteTimer(this)"> 
      Aktifkan Timer Auto-Delete Chat (Default: Mati)
    </label>
    <div id="timer-options" style="display:none; margin-top:10px;">
      <select id="select-timer" onchange="updateTimerDuration()">
        <option value="10">10 Detik</option>
        <option value="30">30 Detik</option>
        <option value="60">1 Menit</option>
      </select>
    </div>
    <button onclick="closeSettings()">Tutup</button>
  </div>
</div>

<!-- Script Integrasi Fitur Audio, VN, & Centang Biru -->
<script>
  // Efek Suara Kirim Pesan (Menggunakan Web Audio API, tanpa file eksternal)
  function playPopSound() {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(580, audioCtx.currentTime);
      oscillator.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
      gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      oscillator.start();
      oscillator.stop(audioCtx.currentTime + 0.08);
    } catch(e) { console.log(e); }
  }

  // Render Centang Biru untuk Developer / Akun @aldev
  function renderUsernameWithBadge(username, isVerified) {
    let badgeHtml = (isVerified || username === 'aldev') ? ' <span style="color: #38ef7d; background: #0f2027; padding: 1px 5px; border-radius: 50%; font-size: 10px;" title="Verified Developer">✔</span>' : '';
    return `<b>@${username}</b>${badgeHtml}`;
  }

  // Toggle Pengaturan Auto-Delete Timer
  function toggleAutoDeleteTimer(checkbox) {
    const timerOpt = document.getElementById('timer-options');
    timerOpt.style.display = checkbox.checked ? 'block' : 'none';
    // Kirim config update ke server...
  }

  // Voice Note Recorder (Sederhana via MediaRecorder)
  let mediaRecorder;
  let audioChunks = [];
  function startRecording() {
    audioChunks = [];
    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
      mediaRecorder.onstop = () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const reader = new FileReader();
        reader.readAsDataURL(audioBlob);
        reader.onloadend = function() {
          // Kirim audioData base64 ke backend
          console.log("VN terkirim!", reader.result);
          playPopSound();
        };
      };
      mediaRecorder.start();
    }).catch(err => alert("Gagal akses mikrofon!"));
  }

  function stopRecording() {
    if(mediaRecorder) mediaRecorder.stop();
  }

  function openSettings() { document.getElementById('settings-modal').style.display = 'block'; }
  function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }
</script>

<style>
  /* Styling tambahan badge & kaca ala glassmorphic */
  .badge-blue {
    color: white;
    background: #1da1f2;
    padding: 0px 4px;
    border-radius: 50%;
    font-size: 11px;
    font-weight: bold;
  }
</style>
